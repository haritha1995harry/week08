name: Frontend CI — Test, Build & Push (auto-detect dir)

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - 'client/**'
      - 'web/**'
      - 'ui/**'
      - 'app/**'
      - '**/package.json'
      - '.github/workflows/frontend_ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - 'client/**'
      - 'web/**'
      - 'ui/**'
      - 'app/**'
      - '**/package.json'
      - '.github/workflows/frontend_ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # needed for Azure OIDC (azure/login@v2)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # e.g. harryweek09acr.azurecr.io  (set this as a repo Secret)
  ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  build_frontend:
    name: Install, (lint/test if present), build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate frontend directory (package.json)
        id: locate
        shell: bash
        run: |
          for d in frontend client web ui app .; do
            if [ -f "$d/package.json" ]; then
              echo "Found package.json in: $d"
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No package.json found in expected dirs." >&2
          echo "Checked: frontend, client, web, ui, app, ."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (ci if lockfile, else install)
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint (if present)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm run lint --if-present

      - name: Test (if present)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm run test --if-present

      - name: Build (if present)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm run build --if-present

  build_and_push_image:
    name: Build & Push Docker image (only on push)
    runs-on: ubuntu-latest
    needs: build_frontend
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate frontend directory (package.json)
        id: locate
        shell: bash
        run: |
          for d in frontend client web ui app .; do
            if [ -f "$d/package.json" ]; then
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No package.json found in expected dirs." >&2
          exit 1

      # ===== Option A: OIDC (recommended) =====
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      # ----- Option B (fallback): Service Principal secret -----
      # - name: Azure login (SP secret)
      #   uses: azure/login@v1
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Derive ACR_NAME from ACR_LOGIN_SERVER
