# week08/.github/workflows/frontend_ci.yml
name: Frontend CI — Test, Build & Push (frontend)

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for Azure OIDC (azure/login@v2)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # e.g. harryweek09acr.azurecr.io  (set as repo Secret AZURE_CONTAINER_REGISTRY)
  ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}

jobs:
  build_frontend:
    name: Install, (lint/test if present), build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use cache ONLY if a lockfile exists
      - name: Setup Node (with cache if lockfile)
        if: ${{ hashFiles('frontend/package-lock.json', 'frontend/npm-shrinkwrap.json', 'frontend/yarn.lock') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/npm-shrinkwrap.json
            frontend/yarn.lock

      - name: Setup Node (no cache)
        if: ${{ hashFiles('frontend/package-lock.json', 'frontend/npm-shrinkwrap.json', 'frontend/yarn.lock') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (ci if lockfile, else install)
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Test (if present)
        run: npm run test --if-present

      - name: Build (if present)
        run: npm run build --if-present

  build_and_push_image:
    name: Build & Push Docker image (only on push)
    runs-on: ubuntu-latest
    needs: build_frontend
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Option A: OIDC (recommended) =====
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}

      # ----- Option B (fallback): Service Principal secret -----
      # - name: Azure login (SP secret)
      #   uses: azure/login@v1
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Derive ACR_NAME from ACR_LOGIN_SERVER
        id: derive
        shell: bash
        run: |
          if [[ -z "${ACR_LOGIN_SERVER}" ]]; then
            echo "ACR_LOGIN_SERVER secret is empty"; exit 1
          fi
          # harryweek09acr.azurecr.io -> harryweek09acr
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name ${{ steps.derive.outputs.ACR_NAME }}

      - name: Build & push frontend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} ./frontend/
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }}
          # optional convenience tag
          docker tag  ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ env.IMAGE_TAG }} ${{ env.ACR_LOGIN_SERVER }}/frontend:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/frontend:latest

      - name: Logout Azure
        if: always()
        run: az logout
